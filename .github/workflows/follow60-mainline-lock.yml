name: Follow60 Mainline Lock
on: [push, pull_request]
jobs:
  follow60-lock-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact HEAD protected-scope verification
        run: python3 scripts/verify-follow60-mainline-lock-v3.py
      - name: Exact-candidate deployment admission
        run: python3 scripts/verify-follow60-deployment-candidate-v1.py
      - name: Lock self-tests
        run: python3 -m unittest -q tests.test_follow60_mainline_lock_v3 tests.test_follow60_deployment_gate_v1
  follow60-promotion-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install Worker test dependencies
        run: python -m pip install -r requirements.txt
      - name: Historical Follow60 promotion matrix
        run: python -m unittest -q tests.test_follow60_v2_mainline_v1 tests.test_follow60_mainline_business_session_binding_v1 tests.test_instagram_list_continuation_contract tests.test_target_followers_progressive_resume_v2 tests.test_follow60_surface_driven_return_ct_v1 tests.test_post_viewer_story_highlight_identity_guard
  follow60-runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Runtime and dispatcher fail-closed self-tests
        run: python3 -m unittest -q tests.test_follow60_mainline_lock_v3
  follow60-performance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CT Resume performance gate
        run: python3 scripts/benchmark-follow60-ct-resume-reacquisition.py
